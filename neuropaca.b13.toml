# B13 · resource-aware sensing soak (RESEARCH_DOSSIER.md §21.1, B13 §B13-C, D-19).
#
# The config the B13 re-validation soak runs under. It is `neuropaca.soak.toml`
# plus the three B13 switches:
#
#   process_collector_enabled = true   -> the per-app RAM/CPU/runtime census
#   process_min_rss_mb        = 200     -> census an app at >= 200 MB grouped RSS
#   raw_metrics_csv_path      = ...     -> the append-only raw-data CSV
#
# Everything cognitive stays at the shipped defaults so the soak measures the
# system that runs. `action_dry_run = true` — nothing executes.
#
#   NEUROPACA_CONFIG=neuropaca.b13.toml neuropacad
#
# The census carries NO exclusion list in round 1 (D-19(c)): the operator wants
# the unfiltered picture first — expect `python` / `node` / `claude` rows and the
# daemon's own footprint in the graph and the CSV. The round-2 exclusion list is
# a soak *output*, not a guess.

model_path = "models/bitnet-2b4t-tq2_0.gguf"
interactive_model_path = "models/qwen2.5-3b-instruct-q4_k_m.gguf"
inference_backend = "llama"

graph_db_path = "data/graph.json"
action_log_path = "data/actions.jsonl"
quarantine_path = "data/quarantine"
log_level = "INFO"
log_to_file = true
log_file_path = "data/neuropaca.log"

# Post-terminal-removal: what scripts/soak_probe.py reads instead of
# `neuropaca health` over the (now-removed) L9 socket. Written atomically
# every health_dump_interval_seconds (default 30s).
health_dump_path = "data/health.json"

# L2 · sensing. Activity on (FocusSession / Distraction), plus the B13 census.
activity_enabled = true
top_process_count = 5
process_collector_enabled = true
process_min_rss_mb = 200.0
# `process_exclude_names` unset -> the Config default (D-20) applies. V-3c: an
# explicit `[]` here overrode it and let the daemon's own processes in as apps.
poll_intervals = { system = 60.0, filesystem = 60.0, process = 60.0 }

# B14 · web-app attribution. The browser stops being one `app:` node — a focused
# tab is matched against the title allowlist and stored as `webapp:<label>`. The
# raw window title never leaves the collector. On for the soak (D5): the run is
# the only way to build the round-2 allowlist from real titles at scale.
webapp_tracking_enabled = true
webapp_map_path = "data/webapp_map.default.toml"
webapp_browser_app_ids = ["brave-browser"]

# B13 · the raw-data CSV. One row per reading: system metrics wide, plus one row
# per censused app. Append-only, no rotation — sweep data/ between soak runs.
raw_metrics_csv_path = "data/raw_metrics.csv"

# B13-B1 · memory-pressure pattern, shipped defaults.
mem_pressure_z = 2.0
mem_pressure_floor_mb = 1024.0
mem_pressure_sustain_seconds = 180.0

watch_paths = ["/home/bhanot/NeuroPaca"]

# L5 · drive. Shipped gradient, unmodified.
pressure_low_threshold = 1.0
pressure_high_threshold = 3.0
pressure_decay_half_life_seconds = 60
pressure_decay_interval_seconds = 10

# L7 · action. LIVE (dry-run off, user decision 2026-09-11), safe tier only —
# notifications reach the desktop (V-12). neuropaca.toml keeps dry-run on.
action_dry_run = false
action_enabled_tiers = ["safe"]
action_confirmation_timeout_seconds = 60
quarantine_ttl_hours = 168

api_call_enabled = false
api_allowlist = []

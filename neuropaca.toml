# NeuroPACA — the SHIPPING configuration (B9 · Hardening).
#
# NOT what neuropacad.service actually runs under on this machine right now
# (found the hard way, 2026-09-14, while wiring up A6.1-A6.3 voice): a
# machine-local systemd drop-in —
# ~/.config/systemd/user/neuropacad.service.d/override.conf — redirects
# NEUROPACA_CONFIG to `neuropaca.b13.toml` instead (the B13 census/S1-S4 soak
# config). That file is the one to edit for anything meant to change the
# live daemon; this one is still what a plain `neuropacad` (no override) or
# `neuropaca doctor` with NEUROPACA_CONFIG unset reads, and what
# `scripts/systemd/neuropacad.service`'s own committed template points at.
#
# This is the config `scripts/systemd/neuropacad.service` points at, and the one
# `neuropaca doctor` reads when NEUROPACA_CONFIG is unset. Until B9 it did not
# exist: neuropaca.soak.toml said "neuropaca.toml (B9, systemd) will ship with
# dry-run on and only the safe tier enabled" and nothing ever created it, so
# doctor reported `config INVALID` and the unit could not have started at all.
#
# How it differs from neuropaca.soak.toml, and why:
#
#   action_enabled_tiers = ["safe"]   — the soak config enables BOTH tiers
#     because a review period is supposed to propose everything and do nothing.
#     The shipped daemon is not a review period. `dangerous` stays off until it
#     has been earned by evidence from a completed soak, per D-14(c).
#
#   action_dry_run = true             — unchanged, and deliberately so. Nothing
#     executes on this machine until the 7-day soak (B9 exit criterion 4) has
#     produced an audit log a human has actually read. rules.md §5.6.
#
# Everything else is byte-for-byte the soak config: the gradient, the decay
# constants, the poll intervals and the model paths are the *shipped* ones, so
# the soak measures the system that runs, not a tuned variant of it.
#
# UPDATED 2026-09-14 (A6.1-A6.3 merged to main): voice is live — sensing,
# transcription, VAD and intent classification all run for real (see the
# voice block below). Its "dangerous"-tier hands (open_app / adjust_volume /
# adjust_brightness) still stay off BY DEFAULT in this shipped config, same
# spirit as this file's original note above (D-14(c): earned, not assumed).
#
# This is no longer because there is no way to answer a confirmation at all
# — `interface/voice_confirmation.py`'s `VoiceConfirmationBridge` now
# answers `ACTION_CONFIRMATION_REQUEST` with a real, strictly-matched
# spoken "yes"/"no" (see its own module docstring, including why it
# deliberately never trusts a notification click instead). Enabling
# "dangerous" tier now DOES make hands work, for whoever opts in — see
# `neuropaca.b13.toml`'s own note for the personal config that does. This
# file stays conservative on purpose: it's the shipped/default reference,
# not a place to flip on real execution for everyone who never asked to.

model_path = "models/bitnet-2b4t-tq2_0.gguf"
# B12 · the interactive model backend. Its only caller (`neuropaca tell <path>
# --explain`) was removed along with the rest of the terminal/CLI interface;
# the config field and BitNetRuntime's dual-model routing were left in place
# as infrastructure a future voice interface is expected to reuse. Unsetting
# this has no effect on anything right now.
interactive_model_path = "models/qwen2.5-3b-instruct-q4_k_m.gguf"
inference_backend = "llama"

graph_db_path = "data/graph.json"
action_log_path = "data/actions.jsonl"
quarantine_path = "data/quarantine"
log_level = "INFO"

# The file sink scripts/logrotate/neuropaca rotates. On under systemd too: the
# journal is bounded by journald and rolls, whereas a 7-day soak wants a log the
# analysis scripts can read back from a fixed path after the fact.
log_to_file = true
log_file_path = "data/neuropaca.log"

# Post-terminal-removal: what scripts/soak_probe.py reads instead of
# `neuropaca health` over the (now-removed) L9 socket.
health_dump_path = "data/health.json"

# L2 · sensing. The real Wayland ActivityCollector (B2.5a/b) — the collector the
# soak gate checks for, and the one whose silence cost B7 three soaks.
activity_enabled = true
top_process_count = 5
# B13-B2 (D-19) · the per-app RAM/CPU/runtime census. On by default; spelled out
# here for visibility. `process_exclude_names` is deliberately NOT set: the
# Config default (D-20 — the daemon's own footprint and tooling) applies. V-3c:
# the round-1 `process_exclude_names = []` left here overrode that default and
# let neuropacad / python3 / cosmic-comp into the graph as apps.
process_collector_enabled = true
process_min_rss_mb = 200.0
poll_intervals = { system = 60.0, filesystem = 60.0, process = 60.0 }

# B14 · web-app attribution. A focused browser tab is matched against the title
# allowlist (`webapp_map_path`) and stored as `webapp:<label>` — the browser
# stops being one opaque node. The raw window title is confined to the collector;
# only the allowlisted label crosses onto the bus.
webapp_tracking_enabled = true
webapp_map_path = "data/webapp_map.default.toml"
webapp_browser_app_ids = ["brave-browser"]

# B13 (operator request) · append-only raw-data CSV — one row per collector
# reading (system metrics wide + one row per censused app). Personal-visibility
# / soak instrument, not part of the loop. No rotation: sweep data/ periodically.
raw_metrics_csv_path = "data/raw_metrics.csv"

# Both the L2 filesystem-sensing scope and the L7 write allowlist (D-14).
# Deliberately just this repo: real edit activity, and the only root that could
# ever be written to is one under version control.
watch_paths = ["/home/bhanot/NeuroPaca"]

# L5 · drive. The shipped gradient, unmodified.
pressure_low_threshold = 1.0
pressure_high_threshold = 3.0
pressure_decay_half_life_seconds = 60
pressure_decay_interval_seconds = 10

# L7 · action. Dry-run ON, and only the safe tier is even proposed — voice's
# hands stay gated until a real confirmation answerer exists (A6.6). See the
# note at the top of this file.
action_dry_run = true
action_enabled_tiers = ["safe"]
action_confirmation_timeout_seconds = 60
quarantine_ttl_hours = 168

# rules.md §5.5 — reserved switches, no class behind them (D-14).
api_call_enabled = false
api_allowlist = []

# A6.1-A6.3 (VISION_PHASES.md A6) · voice — sensing/transcription/intent
# live, hands gated (see the L7 note above), 3 of 6 A6 sub-phases done.
# "both" activation runs the tray push-to-talk toggle and the "hey jarvis"
# wake-word tap at once — click, or just say the phrase;
# interface/activation.py's module docstring covers how the two trigger
# sources share the one microphone without fighting over it. Everything else
# (STT model size, VAD, timeouts, wake-word threshold/window) is left at its
# shipped default — spelled out in core/config.py, not repeated here.
voice_enabled = true
voice_commands_enabled = true
voice_speech_enabled = true
voice_activation_mode = "both"

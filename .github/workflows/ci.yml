name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Privacy invariant (rules.md §6): the test suite must pass with no network.
  # This does not sandbox the runner, but it catches an accidental live call.
  NEUROPACA_OFFLINE: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.1"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync (locked)
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest -q

  egress-test:
    # rules.md §6 — "zero cloud calls", asserted affirmatively (B9/BL-8).
    #
    # This job used to append hosts to /etc/hosts and re-run the same suite,
    # which proved only that a blocked resolver breaks no test — a suite that
    # never opens a socket passed identically either way, and a hardcoded IP
    # would have sailed straight through. It now runs inside a network
    # namespace with nothing but loopback, so "no route out" is a fact about
    # the environment and tests/integration/test_egress_blocked.py can assert
    # against it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.1"
      - run: uv python install 3.12
      # Dependencies are installed *before* the network is taken away.
      - run: uv sync --locked --extra dev

      - name: Egress assertions with no network at all
        run: |
          sudo unshare --net -- bash -c '
            ip link set lo up
            NEUROPACA_OFFLINE=1 .venv/bin/python -m pytest \
              tests/integration/test_egress_blocked.py -q
          '

      - name: Full suite with no network at all
        # rules.md §6's other half: nothing in the suite may *need* the network.
        run: |
          sudo unshare --net -- bash -c '
            ip link set lo up
            NEUROPACA_OFFLINE=1 .venv/bin/python -m pytest -q
          '

[project]
name = "neuropaca"
version = "0.0.0"
description = "Neuromorphic Personal Autonomous Computing Agent — a local-first, always-on behavioural graph daemon."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary — research prototype" }
authors = [{ name = "Jatin Bhanot" }]

# Runtime dependencies are added per build phase, on approval (rules.md §9).
# B1 · Core Infrastructure — GraphMemory wraps a networkx.MultiDiGraph
# (Architecture.md §3.2, D-5). Approved 2026-08-29.
dependencies = [
    "networkx==3.4.2",
]

[project.scripts]
neuropaca = "neuropaca.daemon:main"

[project.optional-dependencies]
# Tooling for the B0 foundation: ruff + mypy + pre-commit + pytest + CI (phases.md B0).
dev = [
    "ruff==0.14.4",
    "mypy==1.18.2",
    "pytest==8.4.2",
    "pytest-asyncio==0.25.3",
    "pre-commit==4.4.0",
]
# The B0 de-risking spike (spikes/b0_bitnet/) — NOT a daemon dependency, never
# imported by src/neuropaca/. Installed only on the target machine for the
# benchmark + coherence ablation. Prefer a native llama.cpp build; this wheel is
# the convenience path.
spike = [
    "llama-cpp-python==0.3.35",
    "psutil==7.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuropaca"]

[tool.uv]
# Keep the resolver honest about the split between daemon and tooling deps.
default-groups = []

# ------------------------------------------------------------------------------
# ruff — lint + format (rules.md §7). ASYNC checks apply repo-wide.
# ------------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "spikes", "scripts"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "ASYNC",         # rules.md §7 — repo-wide
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["neuropaca"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"spikes/**" = ["T201"]  # print() is fine in a throwaway spike
"scripts/**" = ["E402"]  # sys.path bootstrap must precede imports in a standalone script

# ------------------------------------------------------------------------------
# mypy — strict on core/ (rules.md §7). Widened phase by phase.
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src/neuropaca"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = "neuropaca.core.*"
strict = true

[[tool.mypy.overrides]]
# networkx 3.4.2 ships no py.typed marker. Without this, mypy --strict on
# neuropaca.core.* (GraphMemory wraps a MultiDiGraph) fails with
# "Cannot find implementation or library stub for module named 'networkx'".
module = "networkx.*"
ignore_missing_imports = true

# ------------------------------------------------------------------------------
# pytest
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: touches real psutil / filesystem / a real model — excluded from the default run",
]

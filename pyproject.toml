[project]
name = "neuropaca"
version = "0.0.0"
description = "Neuromorphic Personal Autonomous Computing Agent — a local-first, always-on behavioural graph daemon."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary — research prototype" }
authors = [{ name = "Jatin Bhanot" }]

# Runtime dependencies are added per build phase, on approval (rules.md §9).
# B1 · Core Infrastructure — GraphMemory wraps a networkx.MultiDiGraph
#      (Architecture.md §3.2, D-5). Approved 2026-08-29.
# B2 · Sensing — psutil (SystemMetricCollector), watchdog (FileSystemCollector).
#      Approved 2026-08-29 (D-7).
# B5 · Interface (L9) — rich for the CLI's terminal renderers (design.md).
#      Approved 2026-09-01 (user-directed, B5 plan step 4).
dependencies = [
    "networkx==3.4.2",
    "psutil==7.2.2",
    "watchdog==6.0.0",
    "rich==13.9.4",
]

[project.scripts]
# B5: `neuropaca` is now the CLI client; the daemon is `neuropacad` (the
# systemd unit in B9 calls `neuropacad`).
neuropaca = "neuropaca.interface.cli:main"
neuropacad = "neuropaca.daemon:main"

[project.optional-dependencies]
# Tooling for the B0 foundation: ruff + mypy + pre-commit + pytest + CI (phases.md B0).
dev = [
    "ruff==0.14.4",
    "mypy==1.18.2",
    "pytest==8.4.2",
    "pytest-asyncio==0.25.3",
    "pre-commit==4.4.0",
]
# The B0 de-risking spike (spikes/b0_bitnet/) — NOT a daemon dependency, never
# imported by src/neuropaca/. Installed only on the target machine for the
# benchmark + coherence ablation. Prefer a native llama.cpp build; this wheel is
# the convenience path.
spike = [
    "llama-cpp-python==0.3.35",
]
# B2.5 · Process & Activity Sensing (D-9). pywayland powers the real Wayland
# ext-idle-notify ActivityCollector. Optional + lazy-imported: the daemon runs
# without it (the collector self-disables), and CI never installs it (needs
# libwayland-dev + wayland-scanner to build the cffi module).
activity = [
    "pywayland==0.4.19",
]
# B4 · Learning (L4, D-11). llama-cpp-python is the in-process BitNet b1.58 2B4T
# runtime. Optional + lazy-imported: `LlamaCppBackend.load()` catches ImportError,
# logs, and the daemon runs on with L4 inert (CI runners have no C toolchain).
llama = [
    "llama-cpp-python==0.3.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuropaca"]

[tool.uv]
# Keep the resolver honest about the split between daemon and tooling deps.
default-groups = []

# ------------------------------------------------------------------------------
# ruff — lint + format (rules.md §7). ASYNC checks apply repo-wide.
# ------------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "spikes", "scripts"]
# B2.5b: pywayland.scanner-generated protocol bindings — vendored verbatim,
# regenerate with sensing/activity/_protocols/scan.py, never hand-edit.
extend-exclude = ["src/neuropaca/sensing/activity/_protocols/*_v1.py"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "ASYNC",         # rules.md §7 — repo-wide
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["neuropaca"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"spikes/**" = ["T201"]  # print() is fine in a throwaway spike
"scripts/**" = ["E402"]  # sys.path bootstrap must precede imports in a standalone script

# ------------------------------------------------------------------------------
# mypy — strict on core/ (rules.md §7). Widened phase by phase.
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src/neuropaca"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = "neuropaca.core.*"
strict = true

[[tool.mypy.overrides]]
# Third-party packages without bundled type information (B1: networkx; B2:
# psutil, watchdog). Their call sites are outside the --strict core.
module = ["networkx.*", "psutil.*", "watchdog.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pywayland ships partial/incomplete types and is an optional extra CI never
# installs — treat it as fully untyped whether or not it is present (B2.5).
module = ["pywayland.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# llama-cpp-python is an optional extra CI never installs (B4, D-11) and ships
# no type information — fully untyped whether or not it is present.
module = ["llama_cpp.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# Vendored pywayland.scanner output (B2.5b) — generated, regenerate via
# _protocols/scan.py, not type-checked.
module = ["neuropaca.sensing.activity._protocols.*"]
ignore_errors = true
ignore_missing_imports = true
follow_imports = "skip"

# ------------------------------------------------------------------------------
# pytest
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers -m 'not integration and not stress'"
asyncio_mode = "auto"
markers = [
    "integration: touches real psutil / filesystem / a real model — run with `-m integration`",
    "stress: peak-throttle load / latency suite (B4 prep) — slow, run with `-m stress`",
]
